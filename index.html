<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover'/>
  <meta name='apple-mobile-web-app-capable' content='yes'/>
  <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'/>
  <link rel='manifest' href='manifest.json'/>
  <title>News Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card: rgba(17, 24, 39, 0.8);
      --ink: #f9fafb;
      --muted: #9ca3af;
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.4);
      --accent: #6366f1;
      --glass: rgba(255, 255, 255, 0.03);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.15) 0%, transparent 40%);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      flex: 1;
      overflow-y: auto;
      padding: calc(20px + var(--safe-top)) 16px 100px;
      scroll-behavior: smooth;
    }

    /* --- HEADER --- */
    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(to right, #10b981, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ai-indicator {
      background: var(--glass);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      color: var(--primary);
    }

    /* --- STATUS CENTER --- */
    .status-center { text-align: center; padding: 20px 0; }
    .core-orb {
      width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 15px;
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .core-orb.running { animation: corePulse 1.5s infinite; }
    @keyframes corePulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
    .core-orb svg { width: 40px; height: 40px; fill: white; }
    .status-text { font-size: 16px; font-weight: 600; margin-bottom: 2px; }

    /* --- CARDS --- */
    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;
    }

    /* --- NEWS ITEMS --- */
    .news-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .news-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; color: var(--ink); }
    .news-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
    .news-summary { 
      font-size: 13px; color: #cbd5e1; margin-top: 10px; line-height: 1.5; 
      padding-left: 10px; border-left: 2px solid var(--primary);
    }
    .priority-tag { color: #ef4444; font-weight: 700; margin-right: 6px; }

    /* --- SEARCH BAR --- */
    .search-box {
      background: rgba(0,0,0,0.4);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .search-box input {
      background: transparent; border: none; color: white; flex: 1; outline: none; font-family: inherit; font-size: 15px;
    }

    /* --- BUTTONS --- */
    .btn-main {
      width: 100%; padding: 18px; border-radius: 18px; border: none;
      background: var(--primary); color: white; font-size: 16px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 10px 20px var(--primary-glow);
    }
    .btn-secondary {
      padding: 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      background: var(--glass); color: white; font-size: 13px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }

    /* --- TAB NAVIGATION --- */
    .nav-bar {
      position: fixed; bottom: 25px; left: 16px; right: 16px;
      background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px; padding: 8px; display: flex; justify-content: space-around;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6); z-index: 1000;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--muted); font-size: 10px; font-weight: 600; padding: 8px 12px;
      border-radius: 16px; transition: all 0.3s; flex: 1;
    }
    .nav-item.active { color: var(--primary); background: rgba(16, 185, 129, 0.1); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    /* --- PAGES --- */
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .console { font-family: 'Courier New', monospace; font-size: 10px; color: #10b981; height: 350px; overflow-y: auto; padding: 10px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>News Pro</h1>
      <div class="ai-indicator">Gemini AI Active</div>
    </div>

    <!-- HOME PAGE -->
    <div id="page-home" class="page active">
      <div class="status-center">
        <div id="core-orb" class="core-orb">
          <svg viewBox="0 0 24 24"><path d="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z"/></svg>
        </div>
        <div class="status-text" id="status-main">Intelligence Online</div>
      </div>

      <div class="card">
        <div class="card-title">Cloud Search</div>
        <div class="search-box">
          <svg style="width:20px;height:20px;color:var(--muted)" viewBox="0 0 24 24"><path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/></svg>
          <input id="cloudSearch" type="text" placeholder="Deep Search Keywords..."/>
        </div>
        <button class="btn-main" onclick="triggerAction('search')">Launch Deep Cloud Scan</button>
      </div>

      <div class="card">
        <div class="card-title">Quick Tasks</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
          <button class="btn-secondary" onclick="triggerAction('trigger')">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24"><path fill="currentColor" d="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z"/></svg>
            Alerts Scan
          </button>
          <button class="btn-secondary" onclick="triggerAction('digest')">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,3H5C3.89,3 3,3.89 3,5V19C3,20.11 3.89,21 5,21H19C20.11,21 21,20.11 21,19V5C21,3.89 20.11,3 19,3M19,5V19H5V5H19Z"/></svg>
            Full Digest
          </button>
        </div>
      </div>
    </div>

    <!-- NEWS FEED PAGE -->
    <div id="page-news" class="page">
      <div class="search-box">
        <svg style="width:20px;height:20px;color:var(--muted)" viewBox="0 0 24 24"><path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/></svg>
        <input id="feedSearch" type="text" placeholder="Filter current news..." oninput="filterNews()"/>
      </div>
      <div id="news-container">
        <div style="text-align:center; padding:40px; color:var(--muted)">Loading Intelligence Feed...</div>
      </div>
    </div>

    <!-- CONSOLE PAGE -->
    <div id="page-console" class="page">
      <div class="card" style="height: 450px; padding: 0;">
        <div style="padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; font-size: 13px;">Cloud Terminal</div>
        <div id="console" class="console"></div>
      </div>
    </div>

    <!-- SETTINGS PAGE -->
    <div id="page-settings" class="page">
      <div class="card">
        <div class="card-title">Identity & Repo</div>
        <div class="input-group">
          <label>GitHub Personal Token</label>
          <input id="ghToken" type="password" placeholder="ghp_xxxxxxxxxxxx"/>
        </div>
        <div class="input-group">
          <label>Repository Path</label>
          <input id="ghRepo" type="text" value="SharifHossain18/news-aggregator"/>
        </div>
      </div>
    </div>

  </div>

  <!-- NAVIGATION -->
  <div class="nav-bar">
    <div class="nav-item active" onclick="switchPage('home')">
      <svg viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg>
      Home
    </div>
    <div class="nav-item" onclick="switchPage('news')">
      <svg viewBox="0 0 24 24"><path d="M20,11H4V8H20V11M20,15H4V13H20V15M20,19H4V17H20V19M4,21H20V22H4V21Z"/></svg>
      Feed
    </div>
    <div class="nav-item" onclick="switchPage('console')">
      <svg viewBox="0 0 24 24"><path d="M20,19V7H4V19H20M20,3A2,2 0 0,1 22,5V19A2,2 0 0,1 20,21H4A2,2 0 0,1 2,19V5C2,3.89 2.89,3 4,3H20M13,17V15H18V17H13Z"/></svg>
      Console
    </div>
    <div class="nav-item" onclick="switchPage('settings')">
      <svg viewBox="0 0 24 24"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.35 19.43,11.03L21.54,9.37C21.73,9.22 21.78,8.96 21.66,8.74L19.66,5.27C19.54,5.05 19.27,4.97 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.97 4.46,5.05 4.34,5.27L2.34,8.74C2.22,8.96 2.27,9.22 2.46,9.37L4.57,11.03C4.53,11.35 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97Z"/></svg>
      Settings
    </div>
  </div>

  <script>
    let allNews = [];

    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + pageId).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      const navItems = document.querySelectorAll('.nav-item');
      if (pageId === 'home') navItems[0].classList.add('active');
      if (pageId === 'news') { navItems[1].classList.add('active'); loadNews(); }
      if (pageId === 'console') navItems[2].classList.add('active');
      if (pageId === 'settings') navItems[3].classList.add('active');
    }

    // Load saved config
    document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
    document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || 'SharifHossain18/news-aggregator';

    function addLog(msg, type = 'info') {
      const box = document.getElementById('console');
      const ts = new Date().toLocaleTimeString();
      box.innerHTML += `<div class="log-line"><span class="log-ts">[${ts}]</span> ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    async function loadNews() {
      try {
        const res = await fetch('news_data.json?t=' + Date.now());
        if (!res.ok) throw new Error("No news data found yet.");
        allNews = await res.json();
        renderNews(allNews);
      } catch (e) {
        document.getElementById('news-container').innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted)">${e.message}<br><small>Run a scan to generate data.</small></div>`;
      }
    }

    function renderNews(items) {
      const container = document.getElementById('news-container');
      if (items.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted)">No matching articles found.</div>`;
        return;
      }
      container.innerHTML = items.map(art => `
        <a href="${art.link}" class="news-card" target="_blank">
          <div class="news-title">${art.is_priority ? '<span class="priority-tag">🔥 BREAKING</span>' : ''}${art.title}</div>
          <div class="news-meta">
            <span>📌 ${art.source}</span>
          </div>
          ${art.summary ? `<div class="news-summary">${art.summary}</div>` : ''}
        </a>
      `).join('');
    }

    function filterNews() {
      const q = document.getElementById('feedSearch').value.toLowerCase();
      const filtered = allNews.filter(a => a.title.toLowerCase().includes(q) || (a.summary && a.summary.toLowerCase().includes(q)));
      renderNews(filtered);
    }

    async function triggerAction(mode) {
      const token = document.getElementById('ghToken').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const query = document.getElementById('cloudSearch').value.trim();
      
      if (!token || !repo) { switchPage('settings'); return; }
      localStorage.setItem('ghToken', token);
      localStorage.setItem('ghRepo', repo);

      const orb = document.getElementById('core-orb');
      const statusMain = document.getElementById('status-main');
      
      orb.classList.add('running');
      statusMain.textContent = mode === 'search' ? "Deep Scanning..." : "Scraper Launching...";
      addLog(`Requesting cloud run: ${mode} ${query ? '('+query+')' : ''}`);

      try {
        const url = `https://api.github.com/repos/${repo}/actions/workflows/scrape.yml/dispatches`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' },
          body: JSON.stringify({
            ref: 'main',
            inputs: { mode: mode, query: query }
          })
        });

        if (response.ok) {
          addLog("✅ SUCCESS: Cloud Runner is active.", 'success');
          statusMain.textContent = "Processing Intelligence";
          setTimeout(() => { orb.classList.remove('running'); statusMain.textContent = "Intelligence Online"; }, 8000);
        } else {
          const err = await response.json();
          addLog(`❌ ERROR: ${err.message}`, 'error');
          orb.classList.remove('running');
          statusMain.textContent = "Offline";
        }
      } catch (e) {
        addLog(`❌ NETWORK ERROR: ${e.message}`, 'error');
        orb.classList.remove('running');
      }
    }

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    loadNews();
  </script>
</body>
</html>
