name: News Aggregator Cloud Run

on:
  schedule:
    - cron: '5 1 * * *'  # 7:05 AM Bangladesh time (GMT+6)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (trigger, digest, stats, search)'
        required: true
        default: 'trigger'
      query:
        description: 'Search keywords (for search mode)'
        required: false
        default: ''
      days:
        description: 'Days to look back'
        required: false
        default: '1'
      sources:
        description: 'Comma separated sources'
        required: false
        default: ''
      no_ai:
        description: 'Disable AI (true/false)'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 cloudscraper google-generativeai requests python-dotenv

      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_QUERY: ${{ github.event.inputs.query }}
          SCAN_DAYS: ${{ github.event.inputs.days }}
          SCAN_SOURCES: ${{ github.event.inputs.sources }}
          AI_FILTER_ENABLED: ${{ github.event.inputs.no_ai == 'false' && 'true' || 'false' }}
          AI_SUMMARIZE_ENABLED: ${{ github.event.inputs.no_ai == 'false' && 'true' || 'false' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" == "search" ]; then
            python news_aggregator.py trigger
          elif [ "${{ github.event.inputs.mode }}" == "digest" ]; then
            export FORCE_DIGEST="true"
            python news_aggregator.py trigger
          elif [ "${{ github.event.inputs.mode }}" == "stats" ]; then
            python news_aggregator.py stats
          else
            python news_aggregator.py trigger
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/news_data.json docs/source_stats.json sent_articles.json || true
          git commit -m "Update Feed [skip ci]" || echo "No changes"
          git push origin main
