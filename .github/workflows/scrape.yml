name: News Aggregator Cloud Run

on:
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'trigger'
      query:
        description: 'Search keywords'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install beautifulsoup4 python-dotenv cloudscraper google-generativeai requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'trigger' }}
          SEARCH_QUERY: ${{ github.event.inputs.query }}
        run: |
          if [ "$MODE" = "digest" ]; then
            FORCE_DIGEST=true python news_aggregator.py
          elif [ "$MODE" = "search" ]; then
            SEARCH_QUERY="$SEARCH_QUERY" python news_aggregator.py
          else
            python news_aggregator.py trigger
          fi
      - name: Update Feed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/news_data.json sent_articles.json source_stats.json || true
          git commit -m "Update Feed [skip ci]" || echo "No changes"
          git push origin main
