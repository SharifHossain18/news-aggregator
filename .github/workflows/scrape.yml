name: News Aggregator Cloud Run

on:
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'trigger'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install beautifulsoup4 python-dotenv cloudscraper google-generativeai requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "digest" ]; then
            FORCE_DIGEST=true python news_aggregator.py
          else
            python news_aggregator.py trigger
          fi
