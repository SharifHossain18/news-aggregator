<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'/>
  <title>News Aggregator Pro v2.2 (Interactive Cloud)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { --bg: #030712; --card: rgba(17, 24, 39, 0.8); --primary: #10b981; --accent: #f59e0b; --ink: #f9fafb; --muted: #6b7280; }
    body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; overflow-x: hidden; }
    .wrap { max-width: 500px; margin: 0 auto; padding: 20px 16px; }
    .header { text-align: center; padding: 20px 0; }
    .header h1 { margin: 0; font-size: 24px; color: var(--primary); }
    .header p { margin: 5px 0 0; font-size: 12px; color: var(--muted); }

    .tabs { display: flex; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .tab { flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px; color: var(--muted); }
    .tab.active { background: var(--primary); color: white; }

    .card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px; margin-bottom: 20px; }
    .section-title { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-bottom: 15px; }

    .news-item { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 15px 0; }
    .news-item:last-child { border: none; }
    .news-title { font-size: 15px; font-weight: 600; color: white; text-decoration: none; display: block; margin-bottom: 5px; line-height: 1.4; }
    .news-meta { font-size: 11px; color: var(--muted); }
    .ai-summary { font-size: 13px; color: #a7f3d0; font-style: italic; margin-top: 8px; line-height: 1.5; }

    .btn-primary { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 16px; width: 100%; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 10px; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--ink); padding: 12px; border-radius: 12px; width: 100%; cursor: pointer; margin-top: 10px; }
    
    .status-badge { display: inline-flex; align-items: center; background: rgba(16, 185, 129, 0.1); padding: 4px 10px; border-radius: 20px; color: var(--primary); font-size: 10px; font-weight: 700; }
    
    input[type="text"], input[type="password"], select { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; font-family: inherit; box-sizing: border-box; }
    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 5px; }

    /* Custom Dropdown */
    .ms-container { position: relative; }
    .ms-btn { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; }
    .ms-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #111827; border: 1px solid var(--primary); border-radius: 0 0 16px 16px; display: none; z-index: 100; max-height: 250px; overflow-y: auto; padding: 10px; }
    .ms-item { display: flex; align-items: center; padding: 10px; font-size: 13px; cursor: pointer; }
    .ms-item:hover { background: rgba(255,255,255,0.05); }

    .toggle-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374151; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    .scan-info { background: rgba(16, 185, 129, 0.05); border: 1px dashed rgba(16, 185, 129, 0.3); border-radius: 16px; padding: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .scanning-active { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.1) !important; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .scan-info-left { display: flex; flex-direction: column; }
    .scan-info-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
    .scan-info-val { font-size: 13px; font-weight: 700; color: var(--primary); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Aggregator Pro v2.2</h1>
      <p>Interactive Cloud Hub</p>
    </div>

    <div class="tabs">
      <div id="tabNews" class="tab active" onclick="showTab('news')">News Hub</div>
      <div id="tabSettings" class="tab" onclick="showTab('settings')">Configurations</div>
    </div>

    <div id="viewNews">
      <div class="card">
        <div class="section-title">
          <span>Latest Intelligence</span>
          <button style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:12px;" onclick="loadNews()">Refresh ↻</button>
        </div>
        <div id="scanStats" class="scan-info" style="display:none">
          <div class="scan-info-left" id="scanLabelBox">
            <span class="scan-info-label" id="scanLabel">Last Duration</span>
            <span id="scanDuration" class="scan-info-val">--</span>
          </div>
          <div class="scan-info-left" style="align-items:flex-end">
            <span class="scan-info-label">Source Health</span>
            <span id="scanHealth" class="scan-info-val">--</span>
          </div>
        </div>
        <div id="newsList">Loading news feed...</div>
      </div>
    </div>

    <div id="viewSettings" style="display:none">
      <div class="card">
        <div class="section-title">GitHub API Settings</div>
        <div style="margin-bottom: 15px;">
          <label>GITHUB FINE-GRAINED TOKEN</label>
          <input type="password" id="ghToken" placeholder="github_pat_..." onchange="saveToken()">
          <div style="font-size: 10px; color: var(--muted); margin-top: 4px;">Needed to trigger scans directly from here.</div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Remote Scraper Control</div>
        
        <div class="toggle-container">
          <span style="font-size: 14px;">Gemini AI Intelligence</span>
          <label class="switch"><input type="checkbox" id="aiToggle" checked><span class="slider"></span></label>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
          <div>
            <label>TIME RANGE</label>
            <select id="days">
              <option value="1">1 Day</option>
              <option value="2">2 Days</option>
              <option value="3">3 Days</option>
            </select>
          </div>
          <div>
            <label>SOURCE FILTER</label>
            <div class="ms-container">
              <div id="msBtn" class="ms-btn" onclick="toggleDrop()">
                <span id="msVal">All Sources</span><span>▼</span>
              </div>
              <div id="msDrop" class="ms-dropdown">
                <input type="text" placeholder="Search..." onkeyup="filterSources(this.value)" style="margin-bottom:10px;">
                <div id="msList">Loading...</div>
              </div>
            </div>
          </div>
        </div>

        <button id="triggerBtn" class="btn-primary" onclick="triggerScan('trigger')">🚀 Start Cloud Scan</button>
        <button id="digestBtn" class="btn-outline" onclick="triggerScan('digest')">📋 Run Daily Digest</button>
      </div>
    </div>
  </div>

  <script>
    let selectedSources = [];
    let allSourceNames = [];

    // Load Token
    const savedToken = localStorage.getItem('gh_pat_token');
    if(savedToken) document.getElementById('ghToken').value = savedToken;

    function saveToken() {
      localStorage.setItem('gh_pat_token', document.getElementById('ghToken').value);
    }

    async function loadNews() {
      const list = document.getElementById('newsList');
      const statsDiv = document.getElementById('scanStats');
      try {
        // Load news
        const nRes = await fetch('./news_data.json?t=' + Date.now());
        const data = await nRes.json();
        
        // Load meta stats
        const sRes = await fetch('./source_stats.json?t=' + Date.now());
        const stats = await sRes.json();
        const meta = stats._meta;

        if (meta) {
          statsDiv.style.display = 'flex';
          document.getElementById('scanDuration').textContent = meta.duration || '--';
          document.getElementById('scanHealth').textContent = `${meta.successful_sources || 0} OK / ${meta.failed_sources || 0} Fail`;
        }

        if (!data || data.length === 0) {
          list.innerHTML = "<div style='text-align:center; padding:20px; color:var(--muted)'>No news found. Trigger a scan!</div>";
          return;
        }

        list.innerHTML = data.map((n, i) => `
          <div class="news-item">
            <div style="display:flex; align-items: flex-start; gap: 10px;">
              <span style="font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 3px;">${i + 1}.</span>
              <div style="flex:1">
                <a href="${n.link}" class="news-title" target="_blank">${n.title}</a>
                <div class="news-meta">
                  <span class="status-badge">${n.source}</span>
                  <span style="margin-left:8px">🕒 ${n.time || 'Today'}</span>
                </div>
                ${n.summary ? `<div class="ai-summary">📝 ${n.summary}</div>` : ''}
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = "<div style='color:#ef4444; padding:20px; text-align:center;'>Feed error. Ensure GitHub Action is running.</div>";
      }
    }

    async function loadSources() {
      try {
        const response = await fetch('./source_stats.json?t=' + Date.now());
        const stats = await response.json();
        allSourceNames = Object.keys(stats).sort();
        renderSources();
      } catch (e) {
        document.getElementById('msList').innerHTML = "Could not load sources.";
      }
    }

    function renderSources() {
      document.getElementById('msList').innerHTML = allSourceNames.map(name => `
        <div class="ms-item" onclick="toggleSel('${name}')">
          <input type="checkbox" id="chk_${name.replace(/\s+/g, '')}" ${selectedSources.includes(name)?'checked':''} onclick="event.stopPropagation(); toggleSel('${name}')">
          <span style="margin-left:8px">${name}</span>
        </div>
      `).join('');
    }

    function toggleDrop() {
      const d = document.getElementById('msDrop');
      d.style.display = d.style.display==='block'?'none':'block';
    }

    function toggleSel(name) {
      const i = selectedSources.indexOf(name);
      if (i===-1) selectedSources.push(name); else selectedSources.splice(i, 1);
      document.getElementById('chk_'+name.replace(/\s+/g, '')).checked = selectedSources.includes(name);
      document.getElementById('msVal').textContent = selectedSources.length===0 ? "All Sources" : selectedSources.length + " Selected";
    }

    function filterSources(q) {
      document.querySelectorAll('.ms-item').forEach(i => {
        i.style.display = i.textContent.toLowerCase().includes(q.toLowerCase()) ? 'flex' : 'none';
      });
    }

    function showTab(t) {
      document.getElementById('viewNews').style.display = t==='news'?'block':'none';
      document.getElementById('viewSettings').style.display = t==='settings'?'block':'none';
      document.getElementById('tabNews').classList.toggle('active', t==='news');
      document.getElementById('tabSettings').classList.toggle('active', t==='settings');
    }

    async function triggerScan(mode) {
      const token = document.getElementById('ghToken').value;
      if (!token) { alert("Please enter your GitHub Token first."); return; }

      const btn = mode === 'trigger' ? document.getElementById('triggerBtn') : document.getElementById('digestBtn');
      const oldText = btn.textContent;
      btn.textContent = "⏳ Starting...";
      btn.disabled = true;

      const days = document.getElementById('days').value;
      const no_ai = !document.getElementById('aiToggle').checked;
      const sourcesStr = selectedSources.join(',');

      try {
        // Replace 'user/repo' if this forks, hardcoded for now
        const repo = "SharifHossain18/news-aggregator";
        const url = `https://api.github.com/repos/${repo}/actions/workflows/scrape.yml/dispatches`;
        
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: {
              mode: mode,
              days: days,
              sources: sourcesStr,
              no_ai: no_ai ? 'true' : 'false'
            }
          })
        });

        if (res.ok) {
          btn.textContent = "🚀 Scan Started!";
          btn.style.background = "#10b981";
          
          // Show scanning status in the banner
          const statsDiv = document.getElementById('scanStats');
          const scanLabel = document.getElementById('scanLabel');
          statsDiv.style.display = 'flex';
          statsDiv.classList.add('scanning-active');
          scanLabel.textContent = "🚀 SCANNING...";
          
          setTimeout(() => {
            btn.textContent = oldText;
            btn.disabled = false;
            btn.style.background = "";
            // Keep the banner "Scanning" for 3 minutes or until next refresh
            setTimeout(() => {
                statsDiv.classList.remove('scanning-active');
                scanLabel.textContent = "Last Duration";
            }, 3 * 60 * 1000);
          }, 5000);
        } else {
          const err = await res.json();
          alert("❌ Error: " + (err.message || "Unauthorized. Check your token."));
        }
      } catch(e) {
        alert("Network error.");
      }
      
      btn.textContent = oldText;
      btn.disabled = false;
    }

    window.onclick = (e) => {
      if (!e.target.closest('.ms-container')) {
        document.getElementById('msDrop').style.display = 'none';
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('SW Registered!', reg);
        }).catch(err => {
          console.log('SW Registration Failed!', err);
        });
      });
    }

    loadNews();
    loadSources();

    // Auto-refresh every 5 minutes
    setInterval(() => {
      console.log("Auto-refreshing news feed...");
      loadNews();
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
